# Build the Sphinx documentation site with Pixi (`pixi run -e docs docs`)
# and deploy the rendered HTML to GitHub Pages.
name: Deploy docs to Pages
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "software/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/static.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, but don't cancel an in-progress
# run — we want production deployments to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          environments: docs
          cache: true
      - name: Build docs
        run: pixi run -e docs docs
      - name: Stage rendered HTML
        run: |
          mkdir -p _site
          cp -RL docs/build/html/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
  deploy:
    name: Deploy to Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
