# Pixi CI: format check, build + unit tests on x86_64 and ARM64.
# Replaces the former Nix/Cachix pipeline. ROS 2 Jazzy and all deps come from
# the robostack-jazzy conda channel via Pixi; pixi.lock pins exact versions.
name: CI
on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          environments: format
          cache: true
      - name: treefmt --ci
        run: pixi run -e format fmt-check
  build:
    name: Build + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          environments: default
          cache: true
      - name: Build workspace
        run: pixi run -e default build-test
      - name: Run unit tests
        run: pixi run -e default test
  build-sim:
    name: Build simulation (linux-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          environments: simulation
          cache: true
      - name: Build workspace (with Gazebo)
        run: pixi run -e simulation build
