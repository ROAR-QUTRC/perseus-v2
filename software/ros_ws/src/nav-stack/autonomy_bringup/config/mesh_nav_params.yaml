move_base_flex:
  ros__parameters:
    # mesh_map_path/mesh_map_working_path (mesh_map.mesh_file/mesh_working_file) are set from
    # the launch file, not here -- see navigation.launch.py.
    #
    # Both frames match this project's other stacks: robot_localization's EKF owns
    # odom -> base_link (see ekf_config.yaml), and slam_toolbox (perseus_nav_params.yaml)
    # owns map -> odom. If SLAM isn't running yet, override global_frame:=odom on the
    # command line -- there's no map frame to plan into until something publishes it.
    global_frame: "odom"
    robot_frame: "base_link"
    # The EKF's fused output, not FAST-LIO's raw /Odometry -- see the odom0 comment in
    # ekf_config.yaml for why the raw pose alone shouldn't be trusted as the robot's odometry.
    odom_topic: "/odometry/filtered"
    use_sim_time: false
    force_stop_at_goal: true
    force_stop_on_cancel: true
    planners: ["mesh_planner"]
    mesh_planner:
      # CVP over Dijkstra: it plans a vector field rather than a single path, so the
      # controller can react to being pushed off-path without a full replan.
      type: "cvp_mesh_planner/CVPMeshPlanner"
      # Below mesh_map.static_inflation's inscribed_value (1.0), so planning never
      # crosses the inscribed obstacle ring even before that layer marks it lethal.
      cost_limit: 0.99
      publish_vector_field: true
    planner_patience: 10.0
    planner_max_retries: 2
    project_path_onto_mesh: false
    controllers: ["mesh_controller"]
    mesh_controller:
      type: "mesh_controller/MeshController"
      ang_vel_factor: 7.0
      lin_vel_factor: 1.0
    controller_patience: 2.0
    controller_max_retries: 4
    dist_tolerance: 0.2
    angle_tolerance: 0.8
    cmd_vel_ignored_tolerance: 10.0
    mesh_map:
      mesh_part: "/"
      mesh_working_part: "mesh"
      layers:
        - border
        - height_diff
        - roughness
        - static_combination
        - static_inflation
        - obstacle
        - obstacle_inflation
        - final
      # What planning and control actually read costs from.
      default_layer: "final"
      height_diff:
        type: "mesh_layers/HeightDiffLayer"
        combination_weight: 1.0
        threshold: 0.2
      border:
        type: "mesh_layers/BorderLayer"
        combination_weight: 1.0
        border_cost: 1.0
        threshold: 0.2
      roughness:
        type: "mesh_layers/RoughnessLayer"
        combination_weight: 1.0
        threshold: 0.8
      static_combination:
        # vertex_cost = sum(layer.combination_weight * layer.vertex_cost for layer in inputs)
        type: "mesh_layers/AvgCombinationLayer"
        inputs: ["height_diff", "border", "roughness"]
      static_inflation:
        type: "mesh_layers/InflationLayer"
        inputs: ["static_combination"]
        combination_weight: 1.0
        inflation_radius: 1.5 # outer ring
        inscribed_radius: 0.4 # inner ring
        lethal_value: .inf
        inscribed_value: 1.0
        repulsive_field: false
        cost_scaling_factor: 2.0
      obstacle:
        type: "mesh_layers/ObstacleLayer"
        combination_weight: 1.0
        robot_height: 0.7
        max_obstacle_dist: 10.0
        topic: "obstacle_points"
      obstacle_inflation:
        type: "mesh_layers/InflationLayer"
        inputs: ["obstacle"]
        combination_weight: 1.0
        inflation_radius: 1.5
        inscribed_radius: 0.4
        lethal_value: .inf
        inscribed_value: 1.0
        repulsive_field: false
        cost_scaling_factor: 2.0
      final:
        type: "mesh_layers/MaxCombinationLayer"
        inputs: ["static_inflation", "obstacle_inflation"]
      # edge_weight = edge_length + edge_cost_factor * edge_cost, fed to the global planner.
      # Set to 0.0 for shortest-path-only behaviour.
      edge_cost_factor: 5.0
      publish_edge_weights_text: false
      enable_layer_timer: false
