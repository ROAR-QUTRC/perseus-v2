[pytest]
# The RoboStack Jazzy env ships launch_testing / launch_ros pytest plugins whose
# hookimpls are incompatible with the env's pytest 9 (they still declare the
# `path` argument / a `pytest_launch_collect_makemodule` hook that pytest 9
# dropped). Loading either aborts *every* pytest run in the env with a
# PluginValidationError before a single test is collected. These tests don't use
# launch_testing, so disable both plugins here. See ERRORS.md.
addopts = -p no:launch_testing -p no:launch_ros
