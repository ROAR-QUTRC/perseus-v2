/**:
  ros__parameters:
    # disable feature extraction for FAST-LIO2, Livox sensors scan 
    # non-repetitively the pattern differs every frame, so consecutive 
    # points in a "line" aren't neighbours in any stable geometric sense.
    # Edge-jump detection on that is noise.
    feature_extract_enable: false
    # Downsampling size for the LiDAR point cloud before processing. The default of 3 is
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.2
    filter_size_map: 0.5
    # Side length (m) of the cube of space kept in the ikd-Tree for matching; anything that falls
    # behind is deleted as the cube slides. Bounds memory, not accuracy. Must stay well above
    # 3 * mapping.det_range (210 m here) -- at or below that the cube slides every scan.
    cube_side_length: 500.0
    runtime_pos_log_enable: false
    map_file_path: "~/maps/scan.pcd"
    # map_file_path: "" # perseus file path
    common:
      lid_topic: "/livox/lidar_filtered" # this is for simulation, the simulated lidar can produce NaN and Inf values which cause errors with the algorithm, this takes data from the filter node instead
      # lid_topic: "/livox/lidar" # this is for when running on perseus
      imu_topic: "/livox/imu"
      # TF frames FAST-LIO publishes. These used to be hardcoded in the source and
      # rewritten by patches/fast_lio/frame_id_fix.patch; the fork reads them as
      # parameters, so the values below are now what actually takes effect.
      #
      # FAST-LIO broadcasts no TF at all here (see the publish block): the EKF in
      # autonomy/config/ekf_config_fast_lio.yaml owns odom -> base_link. FAST-LIO only
      # reports /Odometry as odom -> base_link for the EKF to fuse.
      map_frame: "odom" # world-fixed parent frame of /Odometry, /path and the global clouds
      # The IMU inside the Livox: this is the frame FAST-LIO's filter actually estimates.
      # Named after the sensor rather than "imu_frame", which handheld_mapping.launch.py
      # already uses for a different link. Deliberately not base_link: the estimated pose
      # is the IMU's, which on this robot is ~0.43 m from base_link and mounted inverted +
      # yawed 90 deg (perseus.urdf.xacro laser_joint) -- publish.odom_in_base_en composes
      # that mounting instead of mislabelling the frame.
      #
      # With tf_en false this frame is not in TF, so its only remaining use is the header of
      # /cloud_registered_body, which nothing subscribes to. Set publish.scan_bodyframe_pub_en
      # to false to drop that topic and make this value inert.
      body_frame: "livox_imu_frame"
      # must match the URDF link name: it is the source frame of the lid_frame -> base_frame
      # lookup that publish.odom_in_base_en composes with
      lid_frame: "livox_frame"
      base_frame: "base_link"
      time_sync_en: false # ONLY turn on when external time synchronization is really not possible
      time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
      # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
    preprocess:
      lidar_type: 4 # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
      scan_line: 32
      blind: 0.5
      timestamp_unit: 3
      scan_rate: 10
    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0 # read but never used: dead since FAST-LIO 2 dropped FoV-based map trimming
      # Real Mid-360 range (~70 m at high reflectivity, ~40 m at 10%). Used only as the margin
      # that decides when the local map cube slides: the cube moves once the sensor comes within
      # MOV_THRESHOLD (1.5, hardcoded) * det_range of a face, so the observable region never
      # falls outside the retained box. Must satisfy cube_side_length > 3 * det_range, or the
      # cube slides on every scan and thrashes the ikd-Tree.
      det_range: 70.0
      # false for Livox: the factory IMU-LiDAR extrinsic below is accurate, and the extrinsic is
      # only weakly observable unless the robot rotates a lot, so estimating it online mostly adds
      # a wobbly nuisance parameter.
      extrinsic_est_en: false
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
    publish:
      path_en: true # true: publish Path
      effect_map_en: true # true: publish Effects
      map_en: true # true: publish Map cloud
      scan_publish_en: true # false: close all the point cloud output
      dense_publish_en: false # false: low down the points number in a global-frame point clouds scan.
      scan_bodyframe_pub_en: true # true: output the point cloud scans in IMU-body-frame
      # no TF broadcasting from FAST-LIO: the EKF owns odom -> base_link, and two publishers
      # on one TF edge make lookups depend on message arrival order
      tf_en: false
      tf_lidar_en: false # would fight the URDF, which already parents livox_frame under base_link
      tf_base_en: false
      # report the base pose on /Odometry so the EKF can fuse it without needing a transform
      # from the message's child frame to base_link
      odom_in_base_en: true
    pcd_save:
      pcd_save_en: true
      interval: -1 # how many LiDAR frames saved in each pcd file;
      # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
