# NOT a real calibration for this specific Logitech C920 -- these intrinsics
# are borrowed from NVIDIA's own isaac_ros_apriltag test fixture
# (isaac_ros_apriltag/config/camera_info.yaml, same 1280x720 resolution),
# renamed to camera_name "c920" to match camera_c920_params.yaml (avoids a
# usb_cam "does not match" warning -- but doesn't fix accuracy). Good enough
# to demo detection working; NOT good enough to trust the reported pose.
# For accurate pose, run:
#   ros2 run camera_calibration cameracalibrator --size 8x6 --square 0.108 \
#     --ros-args -r image:=/image_raw
# with a real checkerboard target, then replace this file with its output.
image_width: 1280
image_height: 720
camera_name: c920
camera_matrix:
  rows: 3
  cols: 3
  data: [942.53242,   0.     , 642.81122,
           0.     , 946.21221, 346.71313,
           0.     ,   0.     ,   1.     ]
distortion_model: plumb_bob
distortion_coefficients:
  rows: 1
  cols: 5
  data: [0.065725, -0.096954, 0.002318, 0.004110, 0.000000]
rectification_matrix:
  rows: 3
  cols: 3
  data: [1., 0., 0.,
         0., 1., 0.,
         0., 0., 1.]
projection_matrix:
  rows: 3
  cols: 4
  data: [951.11548,   0.     , 647.78203,   0.     ,
           0.     , 959.21429, 347.66431,   0.     ,
           0.     ,   0.     ,   1.     ,   0.     ]
